name: Generate Mission Control Visualizations

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution City and Pacman Grid
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Generate 3D Contribution City
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Pacman Contribution Arcade
        uses: abhisheknaiidu/pacman-contribution-graph@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          # Copy 3D profile outputs if generated
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* dist/
          fi
          # Copy pacman outputs if generated
          if [ -f "pacman.svg" ]; then
            cp pacman.svg dist/pacman.svg
          fi
          if [ -f "pacman-dark.svg" ]; then
            cp pacman-dark.svg dist/pacman-dark.svg
          fi

      - name: Push artifacts to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
