name: Update Telemetry Timestamp

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          CURRENT_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i -E "s/<!-- TIMESTAMP_START -->.*<!-- TIMESTAMP_END -->/<!-- TIMESTAMP_START -->${CURRENT_UTC}<!-- TIMESTAMP_END -->/g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh station telemetry timestamp" && git push origin main)
