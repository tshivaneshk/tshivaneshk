name: Update Daily Transmission and Telemetry Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-station:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick Daily Transmission & Sync Timestamp
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Pick daily one-liner from transmissions.json
            const raw = fs.readFileSync('data/transmissions.json', 'utf8');
            const list = JSON.parse(raw);
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const quote = list[dayOfYear % list.length];

            // 2. Update transmission.svg
            let svg = fs.readFileSync('assets/transmission.svg', 'utf8');
            const quoteRegex = /<text x="0" y="22" class="font-mono txt-quote">[\s\S]*?<\/text>/;
            const newQuoteXml = `<text x="0" y="22" class="font-mono txt-quote">\n      "${quote}"\n    </text>`;
            svg = svg.replace(quoteRegex, newQuoteXml);
            fs.writeFileSync('assets/transmission.svg', svg, 'utf8');

            // 3. Update UTC timestamp in README
            const currentUtc = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(/<!-- TIMESTAMP_START -->.*?<!-- TIMESTAMP_END -->/g, `<!-- TIMESTAMP_START -->${currentUtc}<!-- TIMESTAMP_END -->`);
            fs.writeFileSync('README.md', readme, 'utf8');

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/transmission.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: cycle daily transmission and update telemetry timestamp" && git push origin main)
