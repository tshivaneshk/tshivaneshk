name: Sign the Crew Log
description: Log a message or transmission on the station flight manifest
title: "[CREW LOG]: "
labels: ["crew-log"]
body:
  - type: markdown
    attributes:
      value: "Leave a public transmission for the Mission Control station manifest."
  - type: input
    id: callsign
    attributes:
      label: Crew Callsign
      description: Your name or callsign (max 30 characters).
      placeholder: "e.g. Commander Alice"
    validations:
      required: true
  - type: textarea
    id: transmission
    attributes:
      label: Mission Transmission
      description: Your message or greeting (plain text only, max 120 characters).
      placeholder: "e.g. Clean telemetry readings from Sector 7."
    validations:
      required: true
