<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%">
  <defs>
    <linearGradient id="shipBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ship-hull { fill: url(#shipBg4); stroke: #17233D; stroke-width: 1.5; }
    .txt-name { fill: #00F5D4; font-weight: 700; font-size: 18px; }
    .txt-desc { fill: #7C8BA8; font-size: 12.5px; line-height: 1.5; }
    .txt-tag { fill: #00F5D4; font-size: 11px; font-weight: 600; }
    .chip { fill: #17233D; stroke: #334155; }

    @media (prefers-color-scheme: light) {
      .ship-hull { fill: #FFFFFF; stroke: #CBD5E1; }
      .txt-name { fill: #00B89F; }
      .txt-desc { fill: #475569; }
      .txt-tag { fill: #00B89F; }
      .chip { fill: #F1F5F9; stroke: #CBD5E1; }
    }

    @keyframes bobVessel4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseRing4 {
      0%, 100% { transform: scale(0.9); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    .vessel-bob4 { animation: bobVessel4 5.6s ease-in-out infinite 0.7s; }
    .core-ring4 { animation: pulseRing4 2.5s ease-in-out infinite; transform-origin: 65px 65px; }

    @media (prefers-reduced-motion: reduce) {
      .vessel-bob4, .core-ring4 { animation: none !important; }
    }
  </style>

  <path d="M 20,1 L 560,1 L 579,20 L 579,260 L 560,279 L 20,279 L 1,260 L 1,20 Z" class="ship-hull"/>

  <!-- Left: Ship Silhouette (Open Source Carrier with Docking Ring & Teal Emitter) -->
  <g class="vessel-bob4" transform="translate(30, 36)">
    <!-- Carrier Drone Ring -->
    <circle cx="65" cy="65" r="38" fill="none" stroke="#00F5D4" stroke-width="1.8" stroke-dasharray="8,6" class="core-ring4"/>
    <!-- Central Tug Hull -->
    <polygon points="105,65 85,50 35,50 15,60 5,65 15,70 35,80 85,80" fill="#17233D" stroke="#00F5D4" stroke-width="1.8"/>
    <!-- Command Bridge -->
    <rect x="50" y="58" width="22" height="14" rx="3" fill="#070B14" stroke="#00F5D4" stroke-width="1.2"/>
    <circle cx="61" cy="65" r="3.5" fill="#00F5D4"/>
    <!-- Plasma Exhaust -->
    <polygon points="5,65 -15,59 -24,65 -15,71" fill="#00F5D4" opacity="0.8"/>
    <text x="65" y="118" class="font-mono" font-size="9" fill="#00F5D4" text-anchor="middle" letter-spacing="1">VESSEL // UPSTREAM-04</text>
  </g>

  <!-- Right: Data Readout & Description -->
  <g transform="translate(185, 42)">
    <text x="0" y="20" class="font-mono txt-name">Upstream Core Contributions</text>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#17233D" stroke-width="1.2"/>

    <!-- Verbatim fact description -->
    <text x="0" y="60" class="font-mono txt-desc">
      <tspan x="0" dy="0">• Androguard/apk-parser #8: Fixed critical APK</tspan>
      <tspan x="0" dy="19">  parsing crashes from preview SDK codenames.</tspan>
      <tspan x="0" dy="19">• OWASP/WSTG #1543: Modernized XSSI client</tspan>
      <tspan x="0" dy="19">  side testing methodology.</tspan>
    </text>

    <!-- Chips -->
    <g transform="translate(0, 160)">
      <rect width="130" height="22" rx="4" class="chip"/>
      <text x="65" y="15" class="font-mono txt-tag" text-anchor="middle">Bytecode Analysis</text>

      <rect x="138" width="65" height="22" rx="4" class="chip"/>
      <text x="170.5" y="15" class="font-mono txt-tag" text-anchor="middle">OWASP</text>

      <rect x="211" width="105" height="22" rx="4" class="chip"/>
      <text x="263.5" y="15" class="font-mono txt-tag" text-anchor="middle">PRs Merged</text>
    </g>
  </g>
</svg>
