<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="undockDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="undockLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="50%" stop-color="#DDE5F2"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .undock-hull { fill: url(#undockDark); stroke: #17233D; stroke-width: 1.5; }
    .track-depart { stroke: #17233D; stroke-width: 1.5; stroke-dasharray: 8,8; }
    .beacon-pulse { fill: #00F5D4; }

    @media (prefers-color-scheme: light) {
      .undock-hull { fill: url(#undockLight); stroke: #CBD5E1; }
      .track-depart { stroke: #CBD5E1; }
      .beacon-pulse { fill: #00B89F; }
    }

    @keyframes shipDepart {
      0% { transform: translate(120px, 120px) scale(0.9); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(1040px, 120px) scale(0.35); opacity: 0; }
    }

    @keyframes pulseTarget {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 18px; opacity: 0.15; }
    }

    .ship-leaving { animation: shipDepart 18s linear infinite; }
    .target-ring { animation: pulseTarget 2.4s ease-out infinite; transform-origin: 1080px 120px; }

    @media (prefers-reduced-motion: reduce) {
      .ship-leaving, .target-ring { animation: none !important; }
    }
  </style>

  <!-- Notched Shell -->
  <path d="M 20,1 L 1180,1 L 1199,20 L 1199,220 L 1180,239 L 20,239 L 1,220 L 1,20 Z" class="undock-hull"/>

  <!-- Long Departure Vector Line -->
  <line x1="80" y1="120" x2="1080" y2="120" class="track-depart"/>

  <!-- Distant Pulsing Beacon at (1080, 120) -->
  <circle cx="1080" cy="120" r="14" fill="none" stroke="#00F5D4" stroke-width="1.5" class="target-ring"/>
  <circle cx="1080" cy="120" r="5" class="beacon-pulse"/>
  <text x="1080" y="152" class="font-mono" font-size="10" fill="#7C8BA8" text-anchor="middle" letter-spacing="1">DEEP SPACE RELAY</text>

  <!-- Departing Spacecraft Moving Along the Line -->
  <g class="ship-leaving">
    <polygon points="35,0 10,-12 -14,-12 -8,-3 -22,-15 -30,-12 -25,0 -30,12 -22,15 -8,3 -14,12 10,12" fill="#17233D" stroke="#00F5D4" stroke-width="1.5"/>
    <polygon points="-25,0 -40,-4 -52,0 -40,4" fill="#00F5D4" opacity="0.8"/>
  </g>

  <!-- Status Text -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#00F5D4" letter-spacing="1.5">DEPARTURE TELEMETRY // UNDOCK VECTOR CLEAR</text>
    <text x="0" y="22" class="font-mono" font-size="10.5" fill="#7C8BA8">Course plotted to deep-space research horizons. All thrusters nominal.</text>
  </g>
</svg>
