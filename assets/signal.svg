<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40">
  <defs>
    <linearGradient id="sigDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F5D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sigLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B89F" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00B89F" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00B89F" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#6D3FD6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6D3FD6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .track-wire { stroke: #17233D; stroke-width: 1.5; }
    .pulse-wire { stroke: url(#sigDark); stroke-width: 2; }
    .node-dot { fill: #00F5D4; }
    .node-ring { stroke: #00F5D4; fill: none; }
    .hud-tick { stroke: #7C8BA8; stroke-width: 1.5; }

    @media (prefers-color-scheme: light) {
      .track-wire { stroke: #DDE5F2; }
      .pulse-wire { stroke: url(#sigLight); }
      .node-dot { fill: #00B89F; }
      .node-ring { stroke: #00B89F; }
      .hud-tick { stroke: #6D3FD6; }
    }

    @keyframes shipTravel {
      0% { transform: translateX(60px); }
      50% { transform: translateX(1140px); }
      100% { transform: translateX(60px); }
    }

    @keyframes ringPulse {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 10px; opacity: 0.1; }
    }

    .pulse-travel { animation: shipTravel 14s ease-in-out infinite; }
    .pulse-aura { animation: ringPulse 2.4s ease-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-travel, .pulse-aura { animation: none !important; }
    }
  </style>

  <!-- Track Base Wire -->
  <line x1="30" y1="20" x2="1170" y2="20" class="track-wire"/>
  <line x1="160" y1="20" x2="1040" y2="20" class="pulse-wire"/>

  <!-- HUD Notched Bracket Ticks -->
  <path d="M 40,14 L 30,20 L 40,26" class="hud-tick" fill="none"/>
  <path d="M 1160,14 L 1170,20 L 1160,26" class="hud-tick" fill="none"/>

  <!-- Center Anchor Node -->
  <circle cx="600" cy="20" r="3.5" class="node-dot"/>
  <circle cx="600" cy="20" r="7" class="node-ring" stroke-width="1" opacity="0.6"/>

  <!-- Traveling Signal Beacon -->
  <g class="pulse-travel">
    <circle cx="0" cy="20" r="6" class="node-ring pulse-aura" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="3" class="node-dot"/>
    <polygon points="4,20 8,18 8,22" class="node-dot" opacity="0.8"/>
  </g>
</svg>
