<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <!-- Dark glassmorphic background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- 3D Bevel Highlight Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Outer 3D Deep Shadow -->
    <filter id="shadow3D" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="cyanAmbient" cx="88%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradient for Name Title -->
    <linearGradient id="titleTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Linear Gradient for Rotating 3D Rings -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="grid3D" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap');

    .title-font {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .mono-font {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .body-font {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @keyframes liveGlow {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes beamSweep {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(920px); }
    }

    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbitReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .pulse-dot {
      animation: liveGlow 2.5s ease-in-out infinite;
      transform-origin: 52px 148px;
    }

    .top-reflection {
      animation: beamSweep 8s ease-in-out infinite;
    }

    .orbit-1 {
      animation: orbitRotate 18s linear infinite;
      transform-origin: 815px 90px;
    }

    .orbit-2 {
      animation: orbitReverse 12s linear infinite;
      transform-origin: 815px 90px;
    }
  </style>

  <!-- 3D Card Base with Shadow -->
  <g filter="url(#shadow3D)">
    <rect width="916" height="176" x="2" y="2" rx="14" fill="url(#cardGrad)"/>
    <rect width="916" height="176" x="2" y="2" rx="14" fill="url(#cyanAmbient)"/>
    <rect width="916" height="176" x="2" y="2" rx="14" fill="url(#grid3D)"/>
    
    <!-- 3D Bevel Inset Stroke -->
    <rect width="916" height="176" x="2" y="2" rx="14" fill="none" stroke="url(#bevelGrad)" stroke-width="1.2"/>
  </g>

  <!-- Glass Top Edge Light Reflection -->
  <g clip-path="url(#edgeClip)">
    <clipPath id="edgeClip">
      <rect width="916" height="176" x="2" y="2" rx="14"/>
    </clipPath>
    <line x1="0" y1="2" x2="320" y2="2" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" class="top-reflection"/>
  </g>

  <!-- Left 3D Neon Accent Blade -->
  <rect x="2" y="32" width="3.5" height="114" rx="1.75" fill="#38bdf8"/>
  <rect x="2" y="48" width="2" height="82" rx="1" fill="#ffffff" opacity="0.85"/>

  <!-- Top Pill Tag -->
  <g transform="translate(48, 38)">
    <rect width="260" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="16.5" class="mono-font" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="1.4">SYSTEMS × SECURITY RESEARCH</text>
  </g>

  <!-- Full Name with 3D Depth Treatment -->
  <g transform="translate(48, 102)">
    <text x="0" y="0" class="title-font" font-size="34" font-weight="800" fill="url(#titleTextGrad)" letter-spacing="-0.8">T Shivanesh Kumar</text>
    <text x="390" y="-4" class="mono-font" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">// Software Systems &amp; Internals</text>
  </g>

  <!-- Divider Line with Glow Accent -->
  <line x1="48" y1="124" x2="720" y2="124" stroke="#1e293b" stroke-width="1"/>
  <line x1="48" y1="124" x2="160" y2="124" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Core Proposition Line with Live Pulse Indicator -->
  <g transform="translate(48, 150)">
    <circle cx="5" cy="-4" r="3.5" fill="#10b981" class="pulse-dot"/>
    <text x="20" y="0" class="body-font" font-size="13.5" font-weight="400" fill="#94a3b8">
      Building software, taking it apart to see why it fails, and engineering what holds.
    </text>
  </g>

  <!-- Right Side 3D Abstract System Sphere / Orbitals -->
  <g transform="translate(815, 90)">
    <!-- Base Core Glow -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>

    <!-- Orbital Ring 1 -->
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" class="orbit-1"/>
    <circle cx="46" cy="0" r="2.5" fill="#38bdf8" class="orbit-1"/>

    <!-- Orbital Ring 2 (Tilted) -->
    <g transform="rotate(60)">
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="4, 4" class="orbit-2"/>
      <circle cx="-46" cy="0" r="2" fill="#60a5fa" class="orbit-2"/>
    </g>

    <!-- Outer Ambient Grid Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2, 6"/>
  </g>
</svg>
