<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="60%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="glow" cx="12%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.35; }
    }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    .status-dot { animation: pulseSoft 2.4s ease-in-out infinite; }
  </style>

  <!-- Background Panel -->
  <rect width="798" height="128" x="1" y="1" rx="8" fill="url(#bg)" stroke="#1e232d" stroke-width="1"/>
  <rect width="798" height="128" x="1" y="1" rx="8" fill="url(#glow)"/>

  <!-- Left Status Indicator Bar -->
  <line x1="1" y1="24" x2="1" y2="104" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brand Signature Header -->
  <g transform="translate(36, 56)">
    <text x="0" y="0" class="mono" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">SHIVA</text>
    <rect x="122" y="-27" width="9" height="30" fill="#38bdf8" class="cursor"/>

    <!-- Subtle Tagline -->
    <text x="146" y="-7" class="mono" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1.2">
      // SYSTEMS &amp; DEFENSIVE SECURITY
    </text>
  </g>

  <!-- Personal Positioning Line -->
  <g transform="translate(36, 92)">
    <circle cx="4" cy="-4" r="3" fill="#10b981" class="status-dot"/>
    <text x="16" y="0" class="sans" font-size="13.5" fill="#94a3b8">
      Building software, taking it apart to see why it fails, and engineering what holds.
    </text>
  </g>
</svg>
