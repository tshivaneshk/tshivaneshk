<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <!-- Radial Core Glow -->
    <radialGradient id="coreGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-mono-orbit {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 600;
    }
    
    .orbit-ring-line { stroke: #334155; stroke-dasharray: 4, 6; fill: none; }
    .node-bg { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; }
    .node-text { fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; }
    .core-fill { fill: #00f5d4; }
    .core-aura { fill: url(#coreGlowDark); }

    @media (prefers-color-scheme: light) {
      .orbit-ring-line { stroke: #cbd5e1; }
      .node-bg { fill: #ffffff; stroke: #0284c7; }
      .node-text { fill: #0f172a; }
      .core-fill { fill: #0284c7; }
      .core-aura { fill: url(#coreGlowLight); }
    }

    /* Multi-ring smooth orbit rotations */
    @keyframes spinRing1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinRing2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes spinRing3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterRotate1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes counterRotate2 {
      0% { transform: rotate(-360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes counterRotate3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .orbit-group-1 { animation: spinRing1 22s linear infinite; transform-origin: 440px 170px; }
    .orbit-group-2 { animation: spinRing2 32s linear infinite; transform-origin: 440px 170px; }
    .orbit-group-3 { animation: spinRing3 42s linear infinite; transform-origin: 440px 170px; }

    .node-counter-1 { animation: counterRotate1 22s linear infinite; }
    .node-counter-2 { animation: counterRotate2 32s linear infinite; }
    .node-counter-3 { animation: counterRotate3 42s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .orbit-group-1, .orbit-group-2, .orbit-group-3,
      .node-counter-1, .node-counter-2, .node-counter-3 {
        animation: none !important;
      }
    }
  </style>

  <!-- Orbital Ring Tracks -->
  <circle cx="440" cy="170" r="75" class="orbit-ring-line" stroke-width="1.2"/>
  <circle cx="440" cy="170" r="115" class="orbit-ring-line" stroke-width="1.2"/>
  <circle cx="440" cy="170" r="150" class="orbit-ring-line" stroke-width="1.2"/>

  <!-- Core Planetary Center: Systems & Security -->
  <circle cx="440" cy="170" r="38" class="core-aura"/>
  <circle cx="440" cy="170" r="22" class="core-fill"/>
  <circle cx="440" cy="170" r="14" fill="#0f172a"/>
  <text x="440" y="174" class="font-mono-orbit" fill="#00f5d4" text-anchor="middle" font-size="10" font-weight="700">CORE</text>

  <!-- RING 1 (Inner, r=75): Systems & Core Languages (Python, C, Kotlin, Linux) -->
  <g class="orbit-group-1">
    <!-- Node 1: Python -->
    <g transform="translate(440, 95)">
      <g class="node-counter-1" transform-origin="0 0">
        <rect x="-30" y="-12" width="60" height="24" rx="12" class="node-bg" stroke="#38bdf8"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Python</text>
      </g>
    </g>
    <!-- Node 2: C / C++ -->
    <g transform="translate(515, 170)">
      <g class="node-counter-1" transform-origin="0 0">
        <rect x="-26" y="-12" width="52" height="24" rx="12" class="node-bg" stroke="#00f5d4"/>
        <text x="0" y="1" class="font-mono-orbit node-text">C/C++</text>
      </g>
    </g>
    <!-- Node 3: Kotlin -->
    <g transform="translate(440, 245)">
      <g class="node-counter-1" transform-origin="0 0">
        <rect x="-26" y="-12" width="52" height="24" rx="12" class="node-bg" stroke="#a78bfa"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Kotlin</text>
      </g>
    </g>
    <!-- Node 4: Linux -->
    <g transform="translate(365, 170)">
      <g class="node-counter-1" transform-origin="0 0">
        <rect x="-25" y="-12" width="50" height="24" rx="12" class="node-bg" stroke="#fbbf24"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Linux</text>
      </g>
    </g>
  </g>

  <!-- RING 2 (Middle, r=115): Mobile, Web & Tools (Android, TS/JS, Bash, Git) -->
  <g class="orbit-group-2">
    <!-- Node 5: Android Studio -->
    <g transform="translate(440, 55)">
      <g class="node-counter-2" transform-origin="0 0">
        <rect x="-36" y="-12" width="72" height="24" rx="12" class="node-bg" stroke="#34d399"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Android</text>
      </g>
    </g>
    <!-- Node 6: TypeScript -->
    <g transform="translate(555, 170)">
      <g class="node-counter-2" transform-origin="0 0">
        <rect x="-32" y="-12" width="64" height="24" rx="12" class="node-bg" stroke="#38bdf8"/>
        <text x="0" y="1" class="font-mono-orbit node-text">TS / JS</text>
      </g>
    </g>
    <!-- Node 7: Git / GitHub -->
    <g transform="translate(440, 285)">
      <g class="node-counter-2" transform-origin="0 0">
        <rect x="-32" y="-12" width="64" height="24" rx="12" class="node-bg" stroke="#f87171"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Git / CI</text>
      </g>
    </g>
    <!-- Node 8: Bash -->
    <g transform="translate(325, 170)">
      <g class="node-counter-2" transform-origin="0 0">
        <rect x="-24" y="-12" width="48" height="24" rx="12" class="node-bg" stroke="#a3e635"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Bash</text>
      </g>
    </g>
  </g>

  <!-- RING 3 (Outer, r=150): Security & Specialized Analysis (Scikit-Learn, Wireshark, HTML/CSS) -->
  <g class="orbit-group-3">
    <!-- Node 9: Scikit-learn -->
    <g transform="translate(546, 64)">
      <g class="node-counter-3" transform-origin="0 0">
        <rect x="-42" y="-12" width="84" height="24" rx="12" class="node-bg" stroke="#f59e0b"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Scikit-learn</text>
      </g>
    </g>
    <!-- Node 10: Wireshark -->
    <g transform="translate(546, 276)">
      <g class="node-counter-3" transform-origin="0 0">
        <rect x="-38" y="-12" width="76" height="24" rx="12" class="node-bg" stroke="#06b6d4"/>
        <text x="0" y="1" class="font-mono-orbit node-text">Wireshark</text>
      </g>
    </g>
    <!-- Node 11: HTML / CSS -->
    <g transform="translate(334, 276)">
      <g class="node-counter-3" transform-origin="0 0">
        <rect x="-38" y="-12" width="76" height="24" rx="12" class="node-bg" stroke="#ec4899"/>
        <text x="0" y="1" class="font-mono-orbit node-text">HTML / CSS</text>
      </g>
    </g>
    <!-- Node 12: Security Internals -->
    <g transform="translate(334, 64)">
      <g class="node-counter-3" transform-origin="0 0">
        <rect x="-44" y="-12" width="88" height="24" rx="12" class="node-bg" stroke="#00f5d4"/>
        <text x="0" y="1" class="font-mono-orbit node-text">APK Internals</text>
      </g>
    </g>
  </g>
</svg>
