<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="100%" height="40">
  <defs>
    <linearGradient id="divDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f5d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="divLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .track-line { stroke: #1e293b; }
    .pulse-line { stroke: url(#divDark); }
    .core-node { fill: #00f5d4; }
    .orbit-ring { stroke: #00f5d4; }

    @media (prefers-color-scheme: light) {
      .track-line { stroke: #e2e8f0; }
      .pulse-line { stroke: url(#divLight); }
      .core-node { fill: #0284c7; }
      .orbit-ring { stroke: #0284c7; }
    }

    @keyframes travelShip {
      0% { transform: translateX(40px); }
      50% { transform: translateX(860px); }
      100% { transform: translateX(40px); }
    }

    @keyframes pulseRing {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 12px; opacity: 0.1; }
    }

    .ship-beacon { animation: travelShip 16s ease-in-out infinite; }
    .beacon-ring { animation: pulseRing 2.5s ease-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .ship-beacon, .beacon-ring { animation: none !important; }
    }
  </style>

  <!-- Track Base -->
  <line x1="20" y1="20" x2="880" y2="20" stroke-width="1.5" class="track-line"/>
  <line x1="120" y1="20" x2="780" y2="20" stroke-width="2" class="pulse-line"/>

  <!-- Orbital Node Center -->
  <circle cx="450" cy="20" r="4" class="core-node"/>
  <circle cx="450" cy="20" r="8" fill="none" stroke-width="1" class="orbit-ring" opacity="0.5"/>

  <!-- Traveling Spacecraft Beacon -->
  <g class="ship-beacon">
    <circle cx="0" cy="20" r="7" fill="none" stroke-width="1.5" class="orbit-ring beacon-ring"/>
    <circle cx="0" cy="20" r="3.5" class="core-node"/>
    <polygon points="4,20 9,18 9,22" class="core-node" opacity="0.8"/>
  </g>
</svg>
