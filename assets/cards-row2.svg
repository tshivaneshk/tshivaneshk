<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <filter id="shadow3dDark2" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#020617" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="cardDarkC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    .font-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 13px; line-height: 1.5; }
    .font-code { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }

    .card-surface { fill: url(#cardDarkC); stroke: #1e293b; }
    .txt-primary { fill: #f8fafc; }
    .txt-muted { fill: #94a3b8; }
    .txt-tag { fill: #00f5d4; }
    .chip-bg { fill: #1e293b; stroke: #334155; }

    @media (prefers-color-scheme: light) {
      .card-surface { fill: #ffffff; stroke: #cbd5e1; }
      .txt-primary { fill: #0f172a; }
      .txt-muted { fill: #475569; }
      .txt-tag { fill: #0284c7; }
      .chip-bg { fill: #f1f5f9; stroke: #cbd5e1; }
    }

    @keyframes floatC { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes floatD { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes pulseDot2 { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .c-float-3 { animation: floatC 5.2s ease-in-out infinite 0.2s; }
    .c-float-4 { animation: floatD 5.8s ease-in-out infinite 0.8s; }
    .pulse-dot-2 { animation: pulseDot2 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .c-float-3, .c-float-4, .pulse-dot-2 { animation: none !important; }
    }
  </style>

  <!-- CARD 3: AlphaStick-Android -->
  <g class="c-float-3" transform="translate(15, 10)">
    <rect width="410" height="165" rx="14" class="card-surface" stroke-width="1.5" filter="url(#shadow3dDark2)"/>
    <rect width="410" height="4" rx="2" fill="url(#glowAmber)"/>

    <!-- Module Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#f59e0b" class="pulse-dot-2"/>
      <text x="22" y="12" class="font-code" fill="#f59e0b" letter-spacing="1">MODULE // ANDROID-AUDIT-03</text>
      <a href="https://github.com/tshivaneshk/AlphaStick-Android" target="_blank">
        <text x="0" y="38" class="font-head" font-size="17" class="txt-primary">AlphaStick-Android [↗]</text>
      </a>
    </g>

    <!-- Description -->
    <text x="24" y="82" class="font-body txt-muted">
      <tspan x="24" dy="0">Modular Android security auditor featuring explainable risk</tspan>
      <tspan x="24" dy="19">scoring, heuristic vulnerability detection, and a clean</tspan>
      <tspan x="24" dy="19">MVVM architecture built with Jetpack Compose.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(24, 130)">
      <rect width="55" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="27.5" y="15" class="font-code txt-tag" text-anchor="middle">Kotlin</text>

      <rect x="63" width="125" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="125.5" y="15" class="font-code txt-tag" text-anchor="middle">Jetpack Compose</text>

      <rect x="196" width="95" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="243.5" y="15" class="font-code txt-tag" text-anchor="middle">Android SDK</text>
    </g>
  </g>

  <!-- CARD 4: Upstream Contributions -->
  <g class="c-float-4" transform="translate(455, 10)">
    <rect width="410" height="165" rx="14" class="card-surface" stroke-width="1.5" filter="url(#shadow3dDark2)"/>
    <rect width="410" height="4" rx="2" fill="url(#glowEmerald)"/>

    <!-- Module Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#10b981" class="pulse-dot-2"/>
      <text x="22" y="12" class="font-code" fill="#10b981" letter-spacing="1">MODULE // OPEN-SOURCE-04</text>
      <text x="0" y="38" class="font-head" font-size="17" class="txt-primary">Upstream Core Contributions</text>
    </g>

    <!-- Description -->
    <text x="24" y="82" class="font-body txt-muted">
      <tspan x="24" dy="0">• Androguard/apk-parser #8: Resolved preview SDK</tspan>
      <tspan x="24" dy="19">  codename parsing failures in permission routines.</tspan>
      <tspan x="24" dy="19">• OWASP/WSTG #1543: Modernized XSSI testing guidance.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(24, 130)">
      <rect width="130" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="65" y="15" class="font-code txt-tag" text-anchor="middle">Bytecode Analysis</text>

      <rect x="138" width="65" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="170.5" y="15" class="font-code txt-tag" text-anchor="middle">OWASP</text>

      <rect x="211" width="105" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="263.5" y="15" class="font-code txt-tag" text-anchor="middle">PRs Merged</text>
    </g>
  </g>
</svg>
