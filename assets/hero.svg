<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="spaceDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="spaceLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .sans-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .mono-telemetry { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    /* Theme adaptive colors */
    .bg-canvas { fill: url(#spaceDark); }
    .border-canvas { stroke: #1e293b; }
    .text-title { fill: #f8fafc; }
    .text-sub { fill: #94a3b8; }
    .text-dim { fill: #475569; }
    .hud-box { fill: #0f172a; stroke: #334155; }
    .hud-active { fill: #00f5d4; }
    .star-elem { fill: #ffffff; }

    @media (prefers-color-scheme: light) {
      .bg-canvas { fill: url(#spaceLight); }
      .border-canvas { stroke: #cbd5e1; }
      .text-title { fill: #0f172a; }
      .text-sub { fill: #334155; }
      .text-dim { fill: #64748b; }
      .hud-box { fill: #ffffff; stroke: #cbd5e1; }
      .hud-active { fill: #0284c7; }
      .star-elem { fill: #475569; }
    }

    @keyframes twinkleA { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
    @keyframes twinkleB { 0%, 100% { opacity: 0.8; transform: scale(1.2); } 50% { opacity: 0.1; transform: scale(0.7); } }
    @keyframes orbitTravel { 0% { stroke-dashoffset: 400; } 100% { stroke-dashoffset: 0; } }
    @keyframes planetDrift { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
    @keyframes pulseBeam { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    @keyframes scanlineDown { 0% { transform: translateY(-300px); } 100% { transform: translateY(300px); } }

    .twinkle-fast { animation: twinkleA 2.4s infinite ease-in-out; transform-origin: center; }
    .twinkle-slow { animation: twinkleB 3.8s infinite ease-in-out; transform-origin: center; }
    .orbit-anim { stroke-dasharray: 12, 16; animation: orbitTravel 14s linear infinite; }
    .planet-anim { animation: planetDrift 9s ease-in-out infinite; transform-origin: 780px 140px; }
    .telemetry-pulse { animation: pulseBeam 3s ease-in-out infinite; }
    .scanline-sweep { animation: scanlineDown 9s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .twinkle-fast, .twinkle-slow, .orbit-anim, .planet-anim, .telemetry-pulse, .scanline-sweep {
        animation: none !important;
      }
    }
  </style>

  <!-- Frame Background -->
  <rect width="918" height="298" x="1" y="1" rx="16" class="bg-canvas" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Starfield Layer -->
  <g class="twinkle-fast"><circle cx="75" cy="45" r="2.2" class="star-elem" filter="url(#starGlow)"/></g>
  <g class="twinkle-slow"><circle cx="210" cy="110" r="1.5" class="star-elem"/></g>
  <g class="twinkle-fast"><circle cx="360" cy="35" r="2" class="star-elem" filter="url(#starGlow)"/></g>
  <g class="twinkle-slow"><circle cx="520" cy="85" r="1.2" class="star-elem"/></g>
  <g class="twinkle-fast"><circle cx="670" cy="40" r="2" fill="#00f5d4" filter="url(#starGlow)"/></g>
  <g class="twinkle-slow"><circle cx="860" cy="85" r="1.8" class="star-elem"/></g>
  <g class="twinkle-fast"><circle cx="140" cy="240" r="1.5" class="star-elem"/></g>
  <g class="twinkle-slow"><circle cx="480" cy="250" r="2" class="star-elem"/></g>
  <g class="twinkle-fast"><circle cx="710" cy="230" r="1.6" fill="#a78bfa"/></g>

  <!-- Orbit Path Lines -->
  <path d="M -50,220 Q 350,60 970,160" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.4"/>
  <path d="M -50,220 Q 350,60 970,160" fill="none" stroke="#00f5d4" stroke-width="1.5" class="orbit-anim"/>

  <!-- Right Side Celestial Body: Gas Giant with Rings -->
  <g class="planet-anim" transform="translate(0, 0)">
    <!-- Back of Ring -->
    <ellipse cx="780" cy="140" rx="90" ry="24" fill="none" stroke="#475569" stroke-width="3" opacity="0.4" transform="rotate(-18 780 140)"/>
    <!-- Planet Core -->
    <circle cx="780" cy="140" r="48" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <path d="M 740,120 Q 780,105 820,120 Q 780,135 740,120 Z" fill="#312e81" opacity="0.7"/>
    <path d="M 735,145 Q 780,130 825,145 Q 780,160 735,145 Z" fill="#4338ca" opacity="0.6"/>
    <!-- Front of Ring -->
    <path d="M 695,152 A 90 24 0 0 0 865,128" fill="none" stroke="#00f5d4" stroke-width="3" transform="rotate(-18 780 140)"/>
    <!-- Moonlet -->
    <circle cx="680" cy="190" r="5" fill="#a78bfa"/>
  </g>

  <!-- Mission Control HUD: Top Status Strip -->
  <g transform="translate(40, 36)">
    <rect width="320" height="28" rx="6" class="hud-box"/>
    <circle cx="16" cy="14" r="4.5" fill="#00f5d4" class="telemetry-pulse"/>
    <text x="30" y="18" class="mono-telemetry" font-size="11" font-weight="700" fill="#00f5d4" letter-spacing="1.2">MISSION CONTROL // SEC-01</text>
    <text x="210" y="18" class="mono-telemetry" font-size="11" class="text-dim">SYS: READY</text>
    <text x="285" y="18" class="mono-telemetry" font-size="11" fill="#10b981">ONLINE</text>
  </g>

  <!-- Central Launch Identity Statement -->
  <g transform="translate(40, 115)">
    <!-- Sub-label -->
    <rect width="180" height="22" rx="4" class="hud-box"/>
    <text x="12" y="15" class="mono-telemetry" font-size="10.5" font-weight="600" fill="#a78bfa" letter-spacing="1.5">CREW COMMANDER</text>

    <!-- Commander Name -->
    <text x="0" y="64" class="sans-heading" font-size="36" class="text-title" letter-spacing="-0.5">T Shivanesh Kumar</text>

    <!-- Primary Trajectory -->
    <text x="0" y="98" class="mono-telemetry" font-size="15" font-weight="600" class="hud-active">
      Cybersecurity Engineer &amp; Android Systems Developer
    </text>

    <!-- Mission Brief -->
    <text x="0" y="128" class="mono-telemetry" font-size="12.5" class="text-sub">
      Target: System Internals · Bytecode Analysis · Dynamic Threat Forensics
    </text>
  </g>

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(40, 274)">
    <line x1="0" y1="-12" x2="840" y2="-12" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="0" class="mono-telemetry" font-size="10.5" class="text-dim" letter-spacing="1">VESSEL STATUS:</text>
    <text x="110" y="0" class="mono-telemetry" font-size="10.5" fill="#00f5d4">ALL SYSTEMS NOMINAL</text>
    <text x="270" y="0" class="mono-telemetry" font-size="10.5" class="text-dim">|</text>
    <text x="290" y="0" class="mono-telemetry" font-size="10.5" class="text-dim">ORBITAL SECTOR:</text>
    <text x="410" y="0" class="mono-telemetry" font-size="10.5" class="text-sub">REVERSE_ENG // DEFENSIVE_OPS</text>
  </g>
</svg>
