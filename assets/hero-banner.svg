<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Animated Scanline Gradient -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    
    @keyframes subtleScan {
      0% { transform: translateY(-320px); }
      100% { transform: translateY(320px); }
    }

    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: 48px 48px; }
    .scanline { animation: subtleScan 8s linear infinite; }
    .radar { animation: radarSweep 12s linear infinite; transform-origin: 790px 160px; }
  </style>

  <!-- Card Background -->
  <rect width="918" height="318" x="1" y="1" rx="14" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5"/>
  <rect width="918" height="318" x="1" y="1" rx="14" fill="url(#cyanGlow)"/>
  <rect width="918" height="318" x="1" y="1" rx="14" fill="url(#techGrid)"/>

  <!-- Subtle Animated Scanline Overlay -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect width="918" height="318" x="1" y="1" rx="14"/>
    </clipPath>
    <rect width="920" height="120" fill="url(#scanlineGrad)" class="scanline" pointer-events="none"/>
  </g>

  <!-- Top System Bar -->
  <g transform="translate(40, 42)">
    <circle cx="8" cy="8" r="4.5" fill="#10b981" class="pulse"/>
    <text x="24" y="12" class="mono" font-size="11.5" font-weight="600" fill="#10b981" letter-spacing="1.2">SYSTEM OPERATIONAL</text>
    <text x="220" y="12" class="mono" font-size="11.5" fill="#475569">|</text>
    <text x="240" y="12" class="mono" font-size="11.5" fill="#64748b" letter-spacing="1">NODE: SEC-ENG // T-SHIVANESH-K</text>
    <text x="730" y="12" class="mono" font-size="11.5" fill="#0284c7" letter-spacing="1.5">v2.6.4_RELEASE</text>
  </g>

  <!-- Top Divider Line -->
  <line x1="40" y1="68" x2="880" y2="68" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Main Identity Content -->
  <g transform="translate(40, 115)">
    <!-- Identity Badge -->
    <rect width="260" height="26" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="14" y="17" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.8">CYBERSECURITY × SYSTEMS</text>

    <!-- Main Subject Name -->
    <text x="0" y="68" class="sans" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">T Shivanesh Kumar</text>

    <!-- Concise Core Proposition -->
    <text x="0" y="102" class="mono" font-size="14.5" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
      Cybersecurity Engineer &amp; Android Systems Developer
    </text>

    <!-- Operating Directive -->
    <text x="0" y="132" class="sans" font-size="13.5" fill="#64748b" letter-spacing="0.1">
      Specializing in Android internals, binary reverse engineering, network threat analysis,
    </text>
    <text x="0" y="152" class="sans" font-size="13.5" fill="#64748b" letter-spacing="0.1">
      and building security-first systems with defensive rigor.
    </text>
  </g>

  <!-- Right Visual / Radar Telemetry Diagram -->
  <g transform="translate(790, 175)">
    <!-- Outer Decorative Radar Rings -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>

    <!-- Crosshairs -->
    <line x1="-86" y1="0" x2="86" y2="0" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="-86" x2="0" y2="86" stroke="#1e293b" stroke-width="1"/>

    <!-- Rotating Radar Sweep Line -->
    <g class="radar">
      <line x1="0" y1="0" x2="70" y2="-45" stroke="#38bdf8" stroke-width="1.75" stroke-opacity="0.8"/>
      <polygon points="0,0 70,-45 50,-70" fill="#38bdf8" fill-opacity="0.08"/>
    </g>

    <!-- Telemetry Targets -->
    <circle cx="34" cy="-22" r="3" fill="#38bdf8" fill-opacity="0.9"/>
    <circle cx="-42" cy="30" r="2.5" fill="#10b981" fill-opacity="0.8"/>
    <circle cx="20" cy="45" r="2" fill="#0284c7" fill-opacity="0.7"/>

    <text x="-32" y="108" class="mono" font-size="9.5" fill="#475569" letter-spacing="1.2">RADAR // TELEMETRY</text>
  </g>

  <!-- Bottom Technical Pillar Chips -->
  <g transform="translate(40, 290)">
    <text x="0" y="0" class="mono" font-size="11" fill="#475569" letter-spacing="1">DOMAINS:</text>
    <text x="75" y="0" class="mono" font-size="11" fill="#94a3b8">APK PARSING</text>
    <text x="170" y="0" class="mono" font-size="11" fill="#475569">•</text>
    <text x="190" y="0" class="mono" font-size="11" fill="#94a3b8">DYNAMIC FORENSICS</text>
    <text x="335" y="0" class="mono" font-size="11" fill="#475569">•</text>
    <text x="355" y="0" class="mono" font-size="11" fill="#94a3b8">NETWORK IDS</text>
    <text x="455" y="0" class="mono" font-size="11" fill="#475569">•</text>
    <text x="475" y="0" class="mono" font-size="11" fill="#38bdf8">OPEN-SOURCE CORE</text>
  </g>
</svg>
