<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="termDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="termLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>

  <style>
    .mono-term {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .term-window { fill: url(#termDark); stroke: #1e293b; }
    .term-header { fill: #0f172a; stroke: #1e293b; }
    .txt-prompt { fill: #00f5d4; font-weight: 700; }
    .txt-cmd { fill: #f8fafc; font-weight: 600; }
    .txt-out { fill: #94a3b8; }
    .txt-val { fill: #38bdf8; }
    .txt-ok { fill: #10b981; }
    .txt-dim { fill: #475569; }

    @media (prefers-color-scheme: light) {
      .term-window { fill: url(#termLight); stroke: #cbd5e1; }
      .term-header { fill: #e2e8f0; stroke: #cbd5e1; }
      .txt-prompt { fill: #0284c7; }
      .txt-cmd { fill: #0f172a; }
      .txt-out { fill: #334155; }
      .txt-val { fill: #0369a1; }
      .txt-ok { fill: #059669; }
      .txt-dim { fill: #94a3b8; }
    }

    @keyframes termBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .t-cursor { animation: termBlink 0.9s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .t-cursor { animation: none; opacity: 1; }
    }
  </style>

  <!-- Window Container -->
  <rect width="878" height="278" x="1" y="1" rx="12" class="term-window" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <path d="M 1,13 A 12,12 0 0,1 13,1 L 865,1 A 12,12 0 0,1 877,13 L 877,36 L 1,36 Z" class="term-header" stroke-width="1"/>
  
  <!-- Window Control Buttons (Monochrome/subtle technical) -->
  <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8"/>
  <text x="440" y="23" class="mono-term txt-dim" font-size="11" text-anchor="middle">console://orbit-node-01 [shiva@mission-control ~]</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 62)">
    <!-- Command 1: whoami -->
    <text x="0" y="0" class="mono-term">
      <tspan class="txt-prompt">commander@spacecraft:~$</tspan>
      <tspan class="txt-cmd"> whoami</tspan>
    </text>
    <text x="0" y="20" class="mono-term txt-out">
      T Shivanesh Kumar — <tspan class="txt-val">Cybersecurity Engineer &amp; Android Developer</tspan> [ID: SEC-ENG-01]
    </text>

    <!-- Command 2: cat focus.sys -->
    <text x="0" y="52" class="mono-term">
      <tspan class="txt-prompt">commander@spacecraft:~$</tspan>
      <tspan class="txt-cmd"> cat current_focus.sys</tspan>
    </text>
    <text x="0" y="72" class="mono-term txt-out">
      [01] Android security internals, dynamic ADB forensics, and static APK vulnerability analysis.
    </text>
    <text x="0" y="90" class="mono-term txt-out">
      [02] Network intrusion detection systems with raw packet analysis (Wolfsniff).
    </text>
    <text x="0" y="108" class="mono-term txt-out">
      [03] Actively advancing in modern Front End Development &amp; Full Stack web architectures.
    </text>

    <!-- Command 3: ls -la upstream_contributions/ -->
    <text x="0" y="140" class="mono-term">
      <tspan class="txt-prompt">commander@spacecraft:~$</tspan>
      <tspan class="txt-cmd"> ls -la upstream_contributions/</tspan>
    </text>
    <text x="0" y="160" class="mono-term txt-out">
      drwxr-xr-x  androguard/apk-parser   <tspan class="txt-ok">[PR #8 MERGED]</tspan>  handle Android preview codenames in permission loader
    </text>
    <text x="0" y="178" class="mono-term txt-out">
      drwxr-xr-x  OWASP/wstg              <tspan class="txt-ok">[PR #1543 MERGED]</tspan> modernize XSSI client testing guidance
    </text>

    <!-- Interactive Active Command Line -->
    <text x="0" y="208" class="mono-term">
      <tspan class="txt-prompt">commander@spacecraft:~$</tspan>
      <tspan class="txt-cmd"> status --all --verbose</tspan>
      <tspan class="txt-ok"> [ALL SYSTEMS GREEN]</tspan>
    </text>
    <rect x="520" y="196" width="8" height="15" fill="#00f5d4" class="t-cursor"/>
  </g>
</svg>
