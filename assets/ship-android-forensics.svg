<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="shipBg1Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="shipBg1Light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE5F2"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .font-sans { font-family: Inter, Segoe UI, system-ui, -apple-system, sans-serif; }

    .ship-hull { fill: url(#shipBg1Dark); stroke: #17233D; stroke-width: 1.5; }
    .txt-title { fill: #E6EDF7; font-weight: 800; font-size: 26px; }
    .txt-desc  { fill: #7C8BA8; font-size: 16px; line-height: 1.5; }
    .txt-tag   { fill: #00F5D4; font-size: 14px; font-weight: 700; }
    .txt-plate { fill: #00F5D4; font-size: 14px; font-weight: 700; letter-spacing: 1.5; }
    .chip      { fill: #17233D; stroke: #334155; }
    .arrow-pth { fill: none; stroke: #00F5D4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    @media (prefers-color-scheme: light) {
      .ship-hull { fill: url(#shipBg1Light); stroke: #CBD5E1; }
      .txt-title { fill: #0F172A; }
      .txt-desc  { fill: #475569; }
      .txt-tag   { fill: #00B89F; }
      .txt-plate { fill: #00B89F; }
      .chip      { fill: #F1F5F9; stroke: #CBD5E1; }
      .arrow-pth { stroke: #00B89F; }
    }

    @keyframes bobForensics {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes beamScanForensics {
      0%, 100% { opacity: 0.15; transform: scaleX(0.85); }
      50% { opacity: 0.7; transform: scaleX(1.1); }
    }

    .vessel-motion1 { animation: bobForensics 5.2s ease-in-out infinite; }
    .beam-motion1   { animation: beamScanForensics 3s ease-in-out infinite; transform-origin: 300px 75px; }

    @media (prefers-reduced-motion: reduce) {
      .vessel-motion1, .beam-motion1 { animation: none !important; }
    }
  </style>

  <!-- Panel Frame with Notched Corners -->
  <path d="M 22,1 L 578,1 L 599,22 L 599,318 L 578,339 L 22,339 L 1,318 L 1,22 Z" class="ship-hull"/>

  <!-- TOP HALF: Large Centered Ship Silhouette (Forensics Cruiser) -->
  <g class="vessel-motion1" transform="translate(300, 75)">
    <!-- Scanning Beam from Nose -->
    <polygon points="120,0 230,-35 230,35" fill="#00F5D4" opacity="0.2" class="beam-motion1"/>

    <!-- Cruiser Silhouette (Large, 240px wide, centered) -->
    <polygon points="120,0 90,-28 20,-28 -20,-18 -70,-32 -90,-24 -75,0 -90,24 -70,32 -20,18 20,28 90,28" fill="#17233D" stroke="#00F5D4" stroke-width="2.5"/>
    
    <!-- Central Sensor Dome -->
    <ellipse cx="25" cy="-8" rx="28" ry="14" fill="#070B14" stroke="#00F5D4" stroke-width="1.8"/>
    <circle cx="35" cy="0" r="6" fill="#00F5D4"/>

    <!-- Twin Plasma Exhaust -->
    <polygon points="-75,-8 -105,-12 -125,-8 -105,-4" fill="#00F5D4" opacity="0.85"/>
    <polygon points="-75,8 -105,4 -125,8 -105,12" fill="#00F5D4" opacity="0.85"/>
  </g>

  <!-- Vessel Plate Header with ON GOING Status Badge -->
  <text x="36" y="165" class="font-mono txt-plate">VESSEL // FOR-01</text>
  
  <!-- Status Badge: ON GOING -->
  <g transform="translate(450, 148)">
    <rect width="114" height="22" rx="4" fill="#17233D" stroke="#FFB547" stroke-width="1.2"/>
    <circle cx="14" cy="11" r="3.5" fill="#FFB547"/>
    <text x="24" y="15" class="font-mono" font-size="11" font-weight="700" fill="#FFB547" letter-spacing="1">ON GOING</text>
  </g>

  <line x1="36" y1="175" x2="564" y2="175" stroke="#17233D" stroke-width="1.5"/>

  <!-- Title with hand-drawn SVG Arrow -->
  <g transform="translate(36, 210)">
    <text x="0" y="0" class="font-sans txt-title">Android Security &amp; Forensics</text>
    <!-- Link Arrow Path -->
    <g transform="translate(420, -18)">
      <path d="M 0,16 L 16,0 M 4,0 L 16,0 L 16,12" class="arrow-pth"/>
    </g>
  </g>

  <!-- Description (16px, readable, verbatim wording) -->
  <text x="36" y="240" class="font-mono txt-desc">
    <tspan x="36" dy="0">Desktop platform interfacing over ADB for deep static analysis,</tspan>
    <tspan x="36" dy="24">process monitoring, dynamic socket inspection, and reports.</tspan>
  </text>

  <!-- Chips (>= 14px text) -->
  <g transform="translate(36, 290)">
    <rect width="84" height="30" rx="5" class="chip"/>
    <text x="42" y="20" class="font-mono txt-tag" text-anchor="middle">Python</text>

    <rect x="96" width="64" height="30" rx="5" class="chip"/>
    <text x="128" y="20" class="font-mono txt-tag" text-anchor="middle">ADB</text>

    <rect x="172" width="160" height="30" rx="5" class="chip"/>
    <text x="252" y="20" class="font-mono txt-tag" text-anchor="middle">Linux/Windows</text>
  </g>
</svg>
