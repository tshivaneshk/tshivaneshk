<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <linearGradient id="flowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Moving pulse gradient for the pipeline connector -->
    <linearGradient id="activeBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    
    @keyframes pulseStep {
      0%, 100% { fill-opacity: 0.2; stroke: #334155; }
      50% { fill-opacity: 0.8; stroke: #38bdf8; }
    }
    
    @keyframes flowArrow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    
    .flow-line {
      stroke: #38bdf8;
      stroke-dasharray: 4, 4;
      animation: flowArrow 1.2s linear infinite;
    }
  </style>

  <!-- Container -->
  <rect width="918" height="118" x="1" y="1" rx="10" fill="url(#flowBg)" stroke="url(#flowBorder)" stroke-width="1.2"/>

  <!-- Pipeline Track -->
  <line x1="85" y1="60" x2="835" y2="60" stroke="#1e293b" stroke-width="2"/>
  <line x1="85" y1="60" x2="835" y2="60" stroke-width="2" class="flow-line"/>

  <!-- Step 1: Issue Analysis -->
  <g transform="translate(40, 26)">
    <rect width="90" height="68" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="45" cy="22" r="9" fill="#1e293b"/>
    <text x="45" y="26" class="mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">01</text>
    <text x="45" y="47" class="mono" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">ISSUE</text>
    <text x="45" y="60" class="mono" font-size="8.5" fill="#64748b" text-anchor="middle">Inspection</text>
  </g>

  <!-- Step 2: Reproduce -->
  <g transform="translate(175, 26)">
    <rect width="95" height="68" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="47" cy="22" r="9" fill="#1e293b"/>
    <text x="47" y="26" class="mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">02</text>
    <text x="47" y="47" class="mono" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">REPRODUCE</text>
    <text x="47" y="60" class="mono" font-size="8.5" fill="#64748b" text-anchor="middle">Isolated Env</text>
  </g>

  <!-- Step 3: Bytecode / Source Trace -->
  <g transform="translate(315, 26)">
    <rect width="90" height="68" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="45" cy="22" r="9" fill="#1e293b"/>
    <text x="45" y="26" class="mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">03</text>
    <text x="45" y="47" class="mono" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">TRACE</text>
    <text x="45" y="60" class="mono" font-size="8.5" fill="#64748b" text-anchor="middle">Execution Flow</text>
  </g>

  <!-- Step 4: Root Cause Dissection -->
  <g transform="translate(450, 26)">
    <rect width="105" height="68" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.4"/>
    <circle cx="52" cy="22" r="9" fill="#0369a1"/>
    <text x="52" y="26" class="mono" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">04</text>
    <text x="52" y="47" class="mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">ROOT CAUSE</text>
    <text x="52" y="60" class="mono" font-size="8.5" fill="#94a3b8" text-anchor="middle">SDK/Dex/AST</text>
  </g>

  <!-- Step 5: Defensive Patch -->
  <g transform="translate(600, 26)">
    <rect width="90" height="68" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="45" cy="22" r="9" fill="#1e293b"/>
    <text x="45" y="26" class="mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">05</text>
    <text x="45" y="47" class="mono" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="middle">PATCH</text>
    <text x="45" y="60" class="mono" font-size="8.5" fill="#64748b" text-anchor="middle">Robust Fix</text>
  </g>

  <!-- Step 6: Test & PR Validation -->
  <g transform="translate(735, 26)">
    <rect width="130" height="68" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
    <circle cx="65" cy="22" r="9" fill="#065f46"/>
    <text x="65" y="26" class="mono" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">06</text>
    <text x="65" y="47" class="mono" font-size="10.5" font-weight="700" fill="#10b981" text-anchor="middle">TESTS &amp; MERGE</text>
    <text x="65" y="60" class="mono" font-size="8.5" fill="#6ee7b7" text-anchor="middle">Verified Upstream</text>
  </g>
</svg>
