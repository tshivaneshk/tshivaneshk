<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="64">
  <defs>
    <linearGradient id="transDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="transLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE5F2"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-shell { fill: url(#transDark); stroke: #17233D; stroke-width: 1.5; }
    .txt-quote { fill: #E6EDF7; font-size: 13px; font-weight: 500; }
    .txt-lbl { fill: #00F5D4; font-size: 10px; font-weight: 700; letter-spacing: 1.5; }

    @media (prefers-color-scheme: light) {
      .t-shell { fill: url(#transLight); stroke: #CBD5E1; }
      .txt-quote { fill: #0F172A; }
      .txt-lbl { fill: #00B89F; }
    }

    @keyframes blinkCursorT { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor-t { animation: blinkCursorT 0.9s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .cursor-t { animation: none; opacity: 1; }
    }
  </style>

  <path d="M 12,1 L 838,1 L 849,12 L 849,52 L 838,63 L 12,63 L 1,52 L 1,12 Z" class="t-shell"/>
  <circle cx="24" cy="32" r="4" fill="#00F5D4"/>

  <!-- Static/Daily Rendered Transmission Line -->
  <g transform="translate(42, 24)">
    <text x="0" y="0" class="font-mono txt-lbl">COMMS FREQUENCY // SEC-01</text>
    <text x="0" y="22" class="font-mono txt-quote">
      "Memory corruption is just uninvited creative writing."
    </text>
    <rect x="445" y="10" width="7" height="15" fill="#00F5D4" class="cursor-t"/>
  </g>
</svg>
