<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 48" width="100%" height="48">
  <defs>
    <linearGradient id="tagBgDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="tagBgLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <style>
    .mono-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      font-weight: 600;
    }
    .tag-container { fill: url(#tagBgDark); stroke: #334155; }
    .prompt-sym { fill: #00f5d4; }
    .cursor-elem { fill: #00f5d4; }

    @media (prefers-color-scheme: light) {
      .tag-container { fill: url(#tagBgLight); stroke: #cbd5e1; }
      .prompt-sym { fill: #0284c7; }
      .cursor-elem { fill: #0284c7; }
      .line-1, .line-2, .line-3, .line-4 { fill: #0f172a !important; }
    }

    @keyframes showLine1 {
      0%, 23% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes showLine2 {
      0%, 24% { opacity: 0; }
      25%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes showLine3 {
      0%, 49% { opacity: 0; }
      50%, 73% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes showLine4 {
      0%, 74% { opacity: 0; }
      75%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .line-1 { animation: showLine1 16s infinite; }
    .line-2 { animation: showLine2 16s infinite; }
    .line-3 { animation: showLine3 16s infinite; }
    .line-4 { animation: showLine4 16s infinite; }
    .cursor-anim { animation: blinkCursor 0.9s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .line-1 { opacity: 1; animation: none; }
      .line-2, .line-3, .line-4 { display: none; }
      .cursor-anim { animation: none; opacity: 1; }
    }
  </style>

  <rect width="748" height="46" x="1" y="1" rx="8" class="tag-container" stroke-width="1.2"/>

  <!-- Command Prompt Prefix -->
  <text x="20" y="29" class="mono-tag prompt-sym">&gt;</text>
  <text x="36" y="29" class="mono-tag" fill="#64748b">focus:</text>

  <!-- Clean non-overlapping lines via CSS opacity animation -->
  <text x="96" y="29" class="mono-tag line-1" fill="#f8fafc">
    Cybersecurity Engineer &amp; Android Developer
  </text>
  <text x="96" y="29" class="mono-tag line-2" fill="#f8fafc">
    Android Security Researcher &amp; APK Reverse Engineer
  </text>
  <text x="96" y="29" class="mono-tag line-3" fill="#f8fafc">
    Open Source Contributor (Androguard &amp; OWASP)
  </text>
  <text x="96" y="29" class="mono-tag line-4" fill="#f8fafc">
    Learning ML and Full Stack Systems in Public
  </text>

  <!-- Cursor -->
  <rect x="580" y="16" width="8" height="16" rx="1" class="cursor-elem cursor-anim"/>
</svg>
