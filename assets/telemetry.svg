<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="teleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="teleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="50%" stop-color="#DDE5F2"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tele-hull { fill: url(#teleDark); stroke: #17233D; stroke-width: 1.5; }
    .gauge-bg  { fill: #070B14; stroke: #17233D; stroke-width: 1.2; }
    .val-text  { fill: #E6EDF7; font-size: 26px; font-weight: 800; font-family: ui-monospace, monospace; }
    .lbl-text  { fill: #7C8BA8; font-size: 11px; font-weight: 700; letter-spacing: 1.2; }
    .sub-cap   { fill: #7C8BA8; font-size: 10px; font-weight: 500; }
    .glyph     { stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    @media (prefers-color-scheme: light) {
      .tele-hull { fill: url(#teleLight); stroke: #CBD5E1; }
      .gauge-bg  { fill: #FFFFFF; stroke: #CBD5E1; }
      .val-text  { fill: #0F172A; }
      .lbl-text  { fill: #64748B; }
      .sub-cap   { fill: #64748B; }
    }

    /* Slow scanning and reveal animation */
    @keyframes barReveal1 { 0% { width: 0px; } 100% { width: 20px; } }
    @keyframes barReveal2 { 0% { width: 0px; } 100% { width: 140px; } }
    @keyframes barReveal3 { 0% { width: 0px; } 100% { width: 55px; } }
    @keyframes barReveal4 { 0% { width: 0px; } 100% { width: 8px; } }
    @keyframes barReveal5 { 0% { width: 0px; } 100% { width: 105px; } }

    @keyframes scanTele { 0% { transform: translateY(0px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(240px); opacity: 0; } }

    .r-bar1 { animation: barReveal1 1.8s ease-out forwards; }
    .r-bar2 { animation: barReveal2 2.2s ease-out forwards; }
    .r-bar3 { animation: barReveal3 2.0s ease-out forwards; }
    .r-bar4 { animation: barReveal4 1.5s ease-out forwards; }
    .r-bar5 { animation: barReveal5 2.1s ease-out forwards; }

    .t-scan { animation: scanTele 6s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .r-bar1, .r-bar2, .r-bar3, .r-bar4, .r-bar5, .t-scan { animation: none !important; }
      .r-bar1 { width: 20px !important; }
      .r-bar2 { width: 140px !important; }
      .r-bar3 { width: 55px !important; }
      .r-bar4 { width: 8px !important; }
      .r-bar5 { width: 105px !important; }
    }
  </style>

  <!-- Notched Frame Base -->
  <path d="M 20,1 L 1180,1 L 1199,20 L 1199,220 L 1180,239 L 20,239 L 1,220 L 1,20 Z" class="tele-hull"/>

  <!-- Scanning beam -->
  <line x1="1" y1="20" x2="1199" y2="20" stroke="#00F5D4" stroke-width="1.2" class="t-scan"/>

  <!-- HUD Corner Brackets -->
  <path d="M 20,15 L 12,15 L 12,28" stroke="#00F5D4" stroke-width="1.5" fill="none"/>
  <path d="M 1180,15 L 1188,15 L 1188,28" stroke="#00F5D4" stroke-width="1.5" fill="none"/>

  <!-- Top Readout Header -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="-4" r="4" fill="#00F5D4"/>
    <text x="14" y="0" class="font-mono" font-size="11" font-weight="700" fill="#00F5D4" letter-spacing="1.5">TELEMETRY GAUGE READOUT // 5 VECTORS</text>
    <text x="360" y="0" class="font-mono" font-size="10.5" fill="#7C8BA8">AUTHENTIC METRICS HARVESTED LIVE VIA GITHUB API</text>
  </g>

  <!-- 5 Equal Gauge Columns across 1200 w -->
  <!-- Col 1: Stars (x=40) -->
  <g transform="translate(40, 68)">
    <rect width="205" height="120" rx="8" class="gauge-bg"/>
    <!-- Geometric Star Glyph (No Emojis) -->
    <path d="M 24,28 L 27,36 L 36,36 L 29,41 L 32,49 L 24,44 L 16,49 L 19,41 L 12,36 L 21,36 Z" stroke="#FFB547" class="glyph"/>
    <text x="46" y="42" class="font-mono lbl-text">STARS EARNED</text>
    <!-- Value -->
    <text x="24" y="86" class="font-mono val-text">1</text>
    <!-- Gauge Bar -->
    <rect x="24" y="100" width="157" height="6" rx="2" fill="#17233D"/>
    <rect x="24" y="100" height="6" rx="2" fill="#FFB547" class="r-bar1"/>
  </g>

  <!-- Col 2: Commits (x=270) -->
  <g transform="translate(270, 68)">
    <rect width="205" height="120" rx="8" class="gauge-bg"/>
    <!-- Git Commit Node Glyph -->
    <circle cx="24" cy="38" r="5" stroke="#00F5D4" class="glyph"/>
    <line x1="14" y1="38" x2="19" y2="38" stroke="#00F5D4" stroke-width="1.5"/>
    <line x1="29" y1="38" x2="34" y2="38" stroke="#00F5D4" stroke-width="1.5"/>
    <text x="46" y="42" class="font-mono lbl-text">COMMITS (YEAR)</text>
    <text x="24" y="86" class="font-mono val-text">80</text>
    <rect x="24" y="100" width="157" height="6" rx="2" fill="#17233D"/>
    <rect x="24" y="100" height="6" rx="2" fill="#00F5D4" class="r-bar2"/>
  </g>

  <!-- Col 3: Pull Requests (x=500) -->
  <g transform="translate(500, 68)">
    <rect width="205" height="120" rx="8" class="gauge-bg"/>
    <!-- PR Branch Fork Glyph -->
    <circle cx="20" cy="32" r="3.5" stroke="#8B5CF6" class="glyph"/>
    <circle cx="20" cy="46" r="3.5" stroke="#8B5CF6" class="glyph"/>
    <circle cx="32" cy="38" r="3.5" stroke="#8B5CF6" class="glyph"/>
    <path d="M 20,35.5 L 20,42.5 M 20,42.5 Q 26,42.5 32,38" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
    <text x="46" y="42" class="font-mono lbl-text">PULL REQUESTS</text>
    <text x="24" y="86" class="font-mono val-text">5</text>
    <rect x="24" y="100" width="157" height="6" rx="2" fill="#17233D"/>
    <rect x="24" y="100" height="6" rx="2" fill="#8B5CF6" class="r-bar3"/>
  </g>

  <!-- Col 4: Issues (x=730) -->
  <g transform="translate(730, 68)">
    <rect width="205" height="120" rx="8" class="gauge-bg"/>
    <!-- Bug Exclamation Glyph -->
    <circle cx="24" cy="38" r="7" stroke="#38BDF8" class="glyph"/>
    <circle cx="24" cy="38" r="2" fill="#38BDF8"/>
    <text x="46" y="42" class="font-mono lbl-text">ISSUES</text>
    <text x="24" y="86" class="font-mono val-text">0</text>
    <rect x="24" y="100" width="157" height="6" rx="2" fill="#17233D"/>
    <rect x="24" y="100" height="6" rx="2" fill="#38BDF8" class="r-bar4"/>
  </g>

  <!-- Col 5: Contributed Repos (x=960) -->
  <g transform="translate(960, 68)">
    <rect width="200" height="120" rx="8" class="gauge-bg"/>
    <!-- Repository Stack Glyph -->
    <rect x="18" y="32" width="12" height="12" rx="2" stroke="#00F5D4" class="glyph"/>
    <line x1="21" y1="36" x2="27" y2="36" stroke="#00F5D4" stroke-width="1.2"/>
    <line x1="21" y1="40" x2="27" y2="40" stroke="#00F5D4" stroke-width="1.2"/>
    <text x="40" y="42" class="font-mono lbl-text">CONTRIB REPOS</text>
    <text x="24" y="86" class="font-mono val-text">11</text>
    <rect x="24" y="100" width="152" height="6" rx="2" fill="#17233D"/>
    <rect x="24" y="100" height="6" rx="2" fill="#00F5D4" class="r-bar5"/>
  </g>

  <!-- Bottom Edge Caption -->
  <text x="40" y="215" class="font-mono sub-cap">Telemetry, refreshed daily.</text>
</svg>
