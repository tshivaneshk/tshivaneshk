<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%">
  <defs>
    <linearGradient id="shipBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ship-hull { fill: url(#shipBg3); stroke: #17233D; stroke-width: 1.5; }
    .txt-name { fill: #FFB547; font-weight: 700; font-size: 18px; }
    .txt-desc { fill: #7C8BA8; font-size: 12.5px; line-height: 1.5; }
    .txt-tag { fill: #FFB547; font-size: 11px; font-weight: 600; }
    .chip { fill: #17233D; stroke: #334155; }

    @media (prefers-color-scheme: light) {
      .ship-hull { fill: #FFFFFF; stroke: #CBD5E1; }
      .txt-name { fill: #D98A00; }
      .txt-desc { fill: #475569; }
      .txt-tag { fill: #D98A00; }
      .chip { fill: #F1F5F9; stroke: #CBD5E1; }
    }

    @keyframes bobVessel3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shieldPulse3 {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.9; }
    }

    .vessel-bob3 { animation: bobVessel3 5.4s ease-in-out infinite 0.2s; }
    .shield-ring3 { animation: shieldPulse3 2.2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .vessel-bob3, .shield-ring3 { animation: none !important; }
    }
  </style>

  <path d="M 20,1 L 560,1 L 579,20 L 579,260 L 560,279 L 20,279 L 1,260 L 1,20 Z" class="ship-hull"/>

  <!-- Left: Ship Silhouette (Heavily Armored Audit Frigate with Amber Shield Pulse) -->
  <g class="vessel-bob3" transform="translate(30, 36)">
    <!-- Protective Shield Arc -->
    <path d="M 15,35 A 40,40 0 0,1 115,35" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="6,4" class="shield-ring3"/>
    <!-- Frigate Hull -->
    <polygon points="115,65 95,45 80,45 70,35 40,35 30,45 15,55 5,65 15,75 30,85 40,95 70,95 80,85 95,85" fill="#17233D" stroke="#FFB547" stroke-width="1.8"/>
    <!-- Scanner Cockpit -->
    <polygon points="85,65 70,55 50,55 60,65 50,75 70,75" fill="#070B14" stroke="#FFB547" stroke-width="1.2"/>
    <circle cx="88" cy="65" r="3.5" fill="#FFB547"/>
    <!-- Amber Thruster Exhaust -->
    <polygon points="5,65 -15,58 -24,65 -15,72" fill="#FFB547" opacity="0.8"/>
    <text x="65" y="118" class="font-mono" font-size="9" fill="#FFB547" text-anchor="middle" letter-spacing="1">VESSEL // ALPHA-03</text>
  </g>

  <!-- Right: Data Readout & Description -->
  <g transform="translate(185, 42)">
    <text x="0" y="20" class="font-mono txt-name">AlphaStick-Android [↗]</text>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#17233D" stroke-width="1.2"/>

    <!-- Verbatim fact description -->
    <text x="0" y="60" class="font-mono txt-desc">
      <tspan x="0" dy="0">Modular Android vulnerability auditing engine</tspan>
      <tspan x="0" dy="19">with heuristic scanning, explainable risk</tspan>
      <tspan x="0" dy="19">scoring, and clean MVVM architecture built</tspan>
      <tspan x="0" dy="19">with Jetpack Compose.</tspan>
    </text>

    <!-- Chips -->
    <g transform="translate(0, 160)">
      <rect width="55" height="22" rx="4" class="chip"/>
      <text x="27.5" y="15" class="font-mono txt-tag" text-anchor="middle">Kotlin</text>

      <rect x="63" width="125" height="22" rx="4" class="chip"/>
      <text x="125.5" y="15" class="font-mono txt-tag" text-anchor="middle">Jetpack Compose</text>

      <rect x="196" width="95" height="22" rx="4" class="chip"/>
      <text x="243.5" y="15" class="font-mono txt-tag" text-anchor="middle">Android SDK</text>
    </g>
  </g>
</svg>
