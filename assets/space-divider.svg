<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="100%">
  <style>
    @keyframes floatUFO {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-15px, -6px) rotate(-4deg); }
    }
    @keyframes twinkleMini {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
    .ufo { animation: floatUFO 5s ease-in-out infinite; }
    .star { animation: twinkleMini 2s infinite ease-in-out; }
  </style>

  <g class="star"><circle cx="120" cy="30" r="1.5" fill="#ffffff"/></g>
  <g class="star" style="animation-delay: 1s;"><circle cx="780" cy="20" r="2" fill="#ffd166"/></g>
  <g class="star" style="animation-delay: 0.5s;"><circle cx="450" cy="45" r="1.5" fill="#00f5d4"/></g>

  <!-- Cute UFO cruising through divider -->
  <g class="ufo" transform="translate(420, 10)">
    <!-- Glass Dome -->
    <ellipse cx="30" cy="18" rx="14" ry="12" fill="#00f5d4" opacity="0.6"/>
    <!-- Cute alien eyes -->
    <circle cx="27" cy="17" r="2" fill="#0f172a"/>
    <circle cx="33" cy="17" r="2" fill="#0f172a"/>
    <!-- UFO Saucer Base -->
    <ellipse cx="30" cy="26" rx="28" ry="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="16" cy="26" r="2.5" fill="#ff70a6"/>
    <circle cx="30" cy="28" r="2.5" fill="#ffd166"/>
    <circle cx="44" cy="26" r="2.5" fill="#00bbf9"/>
  </g>

  <!-- Dashed orbit track line -->
  <line x1="50" y1="36" x2="380" y2="36" stroke="#334155" stroke-width="2" stroke-dasharray="6,8"/>
  <line x1="500" y1="36" x2="850" y2="36" stroke="#334155" stroke-width="2" stroke-dasharray="6,8"/>
</svg>
