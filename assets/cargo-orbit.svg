<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cargoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="cargoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="50%" stop-color="#DDE5F2"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>

    <!-- Radial Glow for Station Core -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cargo-hull { fill: url(#cargoBgDark); stroke: #17233D; stroke-width: 1.5; }
    .orbit-wire { stroke: #17233D; stroke-width: 1.5; stroke-dasharray: 6,8; fill: none; }
    
    .node-box { fill: #111A2E; stroke: #00F5D4; stroke-width: 1.5; }
    .node-text { fill: #E6EDF7; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    
    .core-base { fill: #111A2E; stroke: #00F5D4; stroke-width: 2; }
    .core-inner { fill: #00F5D4; }

    @media (prefers-color-scheme: light) {
      .cargo-hull { fill: url(#cargoBgLight); stroke: #CBD5E1; }
      .orbit-wire { stroke: #CBD5E1; }
      .node-box { fill: #FFFFFF; stroke: #00B89F; }
      .node-text { fill: #0F172A; }
      .core-base { fill: #FFFFFF; stroke: #00B89F; }
      .core-inner { fill: #00B89F; }
    }

    /* Rings rotation */
    @keyframes orbitClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .orbit-ring1 { animation: orbitClockwise 32s linear infinite; transform-origin: 600px 280px; will-change: transform; }
    .orbit-ring2 { animation: orbitCounterClockwise 44s linear infinite; transform-origin: 600px 280px; will-change: transform; }
    .orbit-ring3 { animation: orbitClockwise 56s linear infinite; transform-origin: 600px 280px; will-change: transform; }

    /* Counter-rotations to keep orbiting nodes straight and upright */
    .keep-upright1 {
      animation: orbitCounterClockwise 32s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    .keep-upright2 {
      animation: orbitClockwise 44s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    .keep-upright3 {
      animation: orbitCounterClockwise 56s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit-ring1, .orbit-ring2, .orbit-ring3,
      .keep-upright1, .keep-upright2, .keep-upright3 {
        animation: none !important;
      }
    }
  </style>

  <!-- Outer Pod Frame with Notched Corners -->
  <path d="M 24,1 L 1176,1 L 1199,24 L 1199,536 L 1176,559 L 24,559 L 1,536 L 1,24 Z" class="cargo-hull"/>

  <!-- Top HUD Header -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" class="font-mono" font-size="12" font-weight="700" fill="#00F5D4" letter-spacing="1.5">CARGO ORBIT // MULTI-TIER REPOSITORY MANIFEST</text>
    <text x="0" y="20" class="font-mono" font-size="11" fill="#7C8BA8">15 active technologies mapped to orbital telemetry nodes</text>
  </g>

  <!-- Orbit Track Circles centered at (600, 280) -->
  <circle cx="600" cy="280" r="105" class="orbit-wire"/>
  <circle cx="600" cy="280" r="165" class="orbit-wire"/>
  <circle cx="600" cy="280" r="225" class="orbit-wire"/>

  <!-- Core Station Center -->
  <circle cx="600" cy="280" r="50" fill="url(#coreAura)"/>
  <circle cx="600" cy="280" r="32" class="core-base"/>
  <circle cx="600" cy="280" r="16" class="core-inner"/>
  <text x="600" y="284" class="font-mono" font-size="9.5" font-weight="700" fill="#070B14" text-anchor="middle">SHIVA</text>

  <!-- ================= RING 1 (Inner, r=105): 4 Core Languages ================= -->
  <g class="orbit-ring1">
    <g transform="translate(600, 175)" class="keep-upright1">
      <rect x="-38" y="-14" width="76" height="28" rx="6" class="node-box" stroke="#00F5D4"/>
      <text x="0" y="1" class="font-mono node-text">Python</text>
    </g>
    <g transform="translate(705, 280)" class="keep-upright1">
      <rect x="-36" y="-14" width="72" height="28" rx="6" class="node-box" stroke="#8B5CF6"/>
      <text x="0" y="1" class="font-mono node-text">Kotlin</text>
    </g>
    <g transform="translate(600, 385)" class="keep-upright1">
      <rect x="-26" y="-14" width="52" height="28" rx="6" class="node-box" stroke="#00F5D4"/>
      <text x="0" y="1" class="font-mono node-text">C</text>
    </g>
    <g transform="translate(495, 280)" class="keep-upright1">
      <rect x="-28" y="-14" width="56" height="28" rx="6" class="node-box" stroke="#FFB547"/>
      <text x="0" y="1" class="font-mono node-text">C++</text>
    </g>
  </g>

  <!-- ================= RING 2 (Middle, r=165): 5 Web & Mobile ================= -->
  <g class="orbit-ring2">
    <g transform="translate(600, 115)" class="keep-upright2">
      <rect x="-44" y="-14" width="88" height="28" rx="6" class="node-box" stroke="#38BDF8"/>
      <text x="0" y="1" class="font-mono node-text">TypeScript</text>
    </g>
    <g transform="translate(757, 229)" class="keep-upright2">
      <rect x="-44" y="-14" width="88" height="28" rx="6" class="node-box" stroke="#FFB547"/>
      <text x="0" y="1" class="font-mono node-text">JavaScript</text>
    </g>
    <g transform="translate(697, 413)" class="keep-upright2">
      <rect x="-32" y="-14" width="64" height="28" rx="6" class="node-box" stroke="#EF4444"/>
      <text x="0" y="1" class="font-mono node-text">HTML</text>
    </g>
    <g transform="translate(503, 413)" class="keep-upright2">
      <rect x="-28" y="-14" width="56" height="28" rx="6" class="node-box" stroke="#38BDF8"/>
      <text x="0" y="1" class="font-mono node-text">CSS</text>
    </g>
    <g transform="translate(443, 229)" class="keep-upright2">
      <rect x="-56" y="-14" width="112" height="28" rx="6" class="node-box" stroke="#10B981"/>
      <text x="0" y="1" class="font-mono node-text">Android Studio</text>
    </g>
  </g>

  <!-- ================= RING 3 (Outer, r=225): 6 Systems & Security Tools ================= -->
  <g class="orbit-ring3">
    <g transform="translate(600, 55)" class="keep-upright3">
      <rect x="-34" y="-14" width="68" height="28" rx="6" class="node-box" stroke="#FFB547"/>
      <text x="0" y="1" class="font-mono node-text">Linux</text>
    </g>
    <g transform="translate(795, 167)" class="keep-upright3">
      <rect x="-30" y="-14" width="60" height="28" rx="6" class="node-box" stroke="#10B981"/>
      <text x="0" y="1" class="font-mono node-text">Bash</text>
    </g>
    <g transform="translate(795, 393)" class="keep-upright3">
      <rect x="-26" y="-14" width="52" height="28" rx="6" class="node-box" stroke="#EF4444"/>
      <text x="0" y="1" class="font-mono node-text">Git</text>
    </g>
    <g transform="translate(600, 505)" class="keep-upright3">
      <rect x="-36" y="-14" width="72" height="28" rx="6" class="node-box" stroke="#E6EDF7"/>
      <text x="0" y="1" class="font-mono node-text">GitHub</text>
    </g>
    <g transform="translate(405, 393)" class="keep-upright3">
      <rect x="-48" y="-14" width="96" height="28" rx="6" class="node-box" stroke="#FFB547"/>
      <text x="0" y="1" class="font-mono node-text">Scikit-learn</text>
    </g>
    <g transform="translate(405, 167)" class="keep-upright3">
      <rect x="-44" y="-14" width="88" height="28" rx="6" class="node-box" stroke="#00F5D4"/>
      <text x="0" y="1" class="font-mono node-text">Wireshark</text>
    </g>
  </g>
</svg>
