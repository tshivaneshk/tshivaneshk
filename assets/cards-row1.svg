<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <!-- 3D Shadow Filters -->
    <filter id="shadow3d" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#050811" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="14" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a233a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>

    <linearGradient id="topGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b90"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <linearGradient id="topGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: "Fredoka", "Comfortaa", "Nunito", -apple-system, sans-serif; font-weight: 800; }
    .font-body { font-family: "Nunito", "Quicksand", -apple-system, sans-serif; font-weight: 600; }
    .font-tag { font-family: ui-monospace, monospace; font-weight: 700; }

    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-0.5deg); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(0.5deg); }
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.1); }
    }

    .card-1 { animation: floatCard1 4s ease-in-out infinite; transform-origin: center; }
    .card-2 { animation: floatCard2 4.6s ease-in-out infinite; transform-origin: center; }
    .b-icon { animation: bounceIcon 2.5s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- CARD 1: Android Security & Forensics -->
  <g class="card-1" transform="translate(15, 10)">
    <!-- 3D Card Base with playful border -->
    <rect width="405" height="170" rx="20" fill="url(#cardBg1)" stroke="#ff7b90" stroke-width="2.5" filter="url(#shadow3d)"/>
    <rect width="405" height="8" rx="4" fill="url(#topGlow1)"/>

    <!-- Fun Icon Badge -->
    <g transform="translate(24, 22)">
      <circle cx="20" cy="20" r="18" fill="#ff7b90" fill-opacity="0.25" stroke="#ff7b90" stroke-width="1.5" class="b-icon"/>
      <text x="20" y="27" font-size="18" text-anchor="middle">🔍</text>
    </g>

    <!-- Title -->
    <text x="75" y="44" class="font-title" font-size="18" fill="#ffffff">Android Security &amp; Forensics</text>

    <!-- Description -->
    <text x="25" y="82" class="font-body" font-size="13" fill="#cbd5e1">
      <tspan x="25" dy="0">Desktop threat-hunter tool interfacing over ADB for</tspan>
      <tspan x="25" dy="20">deep static APK analysis, dynamic socket inspection,</tspan>
      <tspan x="25" dy="20">and automatic vulnerability reporting!</tspan>
    </text>

    <!-- Playful Pill Tags -->
    <g transform="translate(25, 134)">
      <rect width="70" height="24" rx="12" fill="#2a2344" stroke="#ff7b90" stroke-width="1.2"/>
      <text x="35" y="16" class="font-tag" font-size="11" fill="#ff7b90" text-anchor="middle">Python</text>

      <rect x="80" width="55" height="24" rx="12" fill="#2a2344" stroke="#ffb703" stroke-width="1.2"/>
      <text x="107.5" y="16" class="font-tag" font-size="11" fill="#ffb703" text-anchor="middle">ADB</text>

      <rect x="145" width="130" height="24" rx="12" fill="#2a2344" stroke="#00f5d4" stroke-width="1.2"/>
      <text x="210" y="16" class="font-tag" font-size="11" fill="#00f5d4" text-anchor="middle">Linux / Windows</text>
    </g>
  </g>

  <!-- CARD 2: Wolfsniff -->
  <g class="card-2" transform="translate(455, 10)">
    <rect width="405" height="170" rx="20" fill="url(#cardBg2)" stroke="#00f5d4" stroke-width="2.5" filter="url(#shadow3d)"/>
    <rect width="405" height="8" rx="4" fill="url(#topGlow2)"/>

    <!-- Fun Icon Badge -->
    <g transform="translate(24, 22)">
      <circle cx="20" cy="20" r="18" fill="#00f5d4" fill-opacity="0.25" stroke="#00f5d4" stroke-width="1.5" class="b-icon"/>
      <text x="20" y="27" font-size="18" text-anchor="middle">🐺</text>
    </g>

    <!-- Title -->
    <a href="https://github.com/tshivaneshk/Wolfsniff" target="_blank">
      <text x="75" y="44" class="font-title" font-size="19" fill="#00f5d4">Wolfsniff ↗</text>
    </a>

    <!-- Description -->
    <text x="25" y="82" class="font-body" font-size="13" fill="#cbd5e1">
      <tspan x="25" dy="0">Hybrid Network Intrusion Detection System snacking</tspan>
      <tspan x="25" dy="20">on raw network packets in native C &amp; catching threats</tspan>
      <tspan x="25" dy="20">using ML Random Forests mapped to MITRE ATT&amp;CK!</tspan>
    </text>

    <!-- Playful Pill Tags -->
    <g transform="translate(25, 134)">
      <rect width="40" height="24" rx="12" fill="#142c38" stroke="#00f5d4" stroke-width="1.2"/>
      <text x="20" y="16" class="font-tag" font-size="11" fill="#00f5d4" text-anchor="middle">C</text>

      <rect x="50" width="70" height="24" rx="12" fill="#142c38" stroke="#00bbf9" stroke-width="1.2"/>
      <text x="85" y="16" class="font-tag" font-size="11" fill="#00bbf9" text-anchor="middle">Python</text>

      <rect x="130" width="105" height="24" rx="12" fill="#142c38" stroke="#fee440" stroke-width="1.2"/>
      <text x="182.5" y="16" class="font-tag" font-size="11" fill="#fee440" text-anchor="middle">Scikit-learn</text>

      <rect x="245" width="60" height="24" rx="12" fill="#142c38" stroke="#ff7b90" stroke-width="1.2"/>
      <text x="275" y="16" class="font-tag" font-size="11" fill="#ff7b90" text-anchor="middle">PCAP</text>
    </g>
  </g>
</svg>
