<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <filter id="shadow3dDark" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#020617" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="cardDarkA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cardDarkB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .font-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 13px; line-height: 1.5; }
    .font-code { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }

    .card-surface { fill: url(#cardDarkA); stroke: #1e293b; }
    .txt-primary { fill: #f8fafc; }
    .txt-muted { fill: #94a3b8; }
    .txt-tag { fill: #00f5d4; }
    .chip-bg { fill: #1e293b; stroke: #334155; }

    @media (prefers-color-scheme: light) {
      .card-surface { fill: #ffffff; stroke: #cbd5e1; }
      .txt-primary { fill: #0f172a; }
      .txt-muted { fill: #475569; }
      .txt-tag { fill: #0284c7; }
      .chip-bg { fill: #f1f5f9; stroke: #cbd5e1; }
    }

    @keyframes floatA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes pulseDot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .c-float-1 { animation: floatA 5s ease-in-out infinite; }
    .c-float-2 { animation: floatB 5.6s ease-in-out infinite 0.6s; }
    .pulse-dot { animation: pulseDot 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .c-float-1, .c-float-2, .pulse-dot { animation: none !important; }
    }
  </style>

  <!-- CARD 1: Android Security & Forensics Platform -->
  <g class="c-float-1" transform="translate(15, 10)">
    <rect width="410" height="165" rx="14" class="card-surface" stroke-width="1.5" filter="url(#shadow3dDark)"/>
    <rect width="410" height="4" rx="2" fill="url(#glowTeal)"/>

    <!-- Module Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#00f5d4" class="pulse-dot"/>
      <text x="22" y="12" class="font-code" fill="#00f5d4" letter-spacing="1">MODULE // FORENSICS-01</text>
      <text x="0" y="38" class="font-head" font-size="17" class="txt-primary">Android Security &amp; Forensics</text>
    </g>

    <!-- Description -->
    <text x="24" y="82" class="font-body txt-muted">
      <tspan x="24" dy="0">Desktop ADB analysis platform executing deep static</tspan>
      <tspan x="24" dy="19">manifest/APK inspection, background daemon tracing, and</tspan>
      <tspan x="24" dy="19">automated vulnerability threat matrix reports.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(24, 130)">
      <rect width="60" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="30" y="15" class="font-code txt-tag" text-anchor="middle">Python</text>

      <rect x="68" width="48" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="92" y="15" class="font-code txt-tag" text-anchor="middle">ADB</text>

      <rect x="124" width="110" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="179" y="15" class="font-code txt-tag" text-anchor="middle">Linux / Windows</text>
    </g>
  </g>

  <!-- CARD 2: Wolfsniff Network IDS -->
  <g class="c-float-2" transform="translate(455, 10)">
    <rect width="410" height="165" rx="14" class="card-surface" stroke-width="1.5" filter="url(#shadow3dDark)"/>
    <rect width="410" height="4" rx="2" fill="url(#glowViolet)"/>

    <!-- Module Header -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#a78bfa" class="pulse-dot"/>
      <text x="22" y="12" class="font-code" fill="#a78bfa" letter-spacing="1">MODULE // NETWORK-IDS-02</text>
      <a href="https://github.com/tshivaneshk/Wolfsniff" target="_blank">
        <text x="0" y="38" class="font-head" font-size="17" class="txt-primary">Wolfsniff — Hybrid Network IDS [↗]</text>
      </a>
    </g>

    <!-- Description -->
    <text x="24" y="82" class="font-body txt-muted">
      <tspan x="24" dy="0">High-throughput Network IDS combining native C packet</tspan>
      <tspan x="24" dy="19">ingestion with Scikit-learn Random Forest classification</tspan>
      <tspan x="24" dy="19">trained on UNSW-NB15 mapped to MITRE ATT&amp;CK.</tspan>
    </text>

    <!-- Tech Chips -->
    <g transform="translate(24, 130)">
      <rect width="36" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="18" y="15" class="font-code txt-tag" text-anchor="middle">C</text>

      <rect x="44" width="60" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="74" y="15" class="font-code txt-tag" text-anchor="middle">Python</text>

      <rect x="112" width="88" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="156" y="15" class="font-code txt-tag" text-anchor="middle">Scikit-learn</text>

      <rect x="208" width="52" height="22" rx="4" class="chip-bg" stroke-width="1"/>
      <text x="234" y="15" class="font-code txt-tag" text-anchor="middle">PCAP</text>
    </g>
  </g>
</svg>
